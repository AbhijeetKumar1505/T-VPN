name: Release

# Push a tag like v0.2.0 (matching Cargo.toml) to build and publish a release.
# Pull requests that touch packaging run everything except publishing.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - ".github/workflows/publish.yml"
      - "packaging/**"
      - "pyproject.toml"
      - "Cargo.toml"
      - "Cargo.lock"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  WINTUN_URL: https://www.wintun.net/builds/wintun-0.14.1.zip
  WINTUN_SHA256: 07c256185d6ee3652e09fa55c0b673e2624b565e02c4b9091c79ca7d2f24ef51

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      is_release: ${{ steps.v.outputs.is_release }}
    steps:
      - uses: actions/checkout@v7
      - id: v
        run: |
          version="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n1)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag="${GITHUB_REF#refs/tags/}"
            if [[ "$tag" != "v$version" ]]; then
              echo "::error::tag $tag does not match Cargo.toml version $version"
              exit 1
            fi
            if ! grep -q "^## \[$version\]" CHANGELOG.md; then
              echo "::error::CHANGELOG.md has no '## [$version]' section"
              exit 1
            fi
            echo "is_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_release=false" >> "$GITHUB_OUTPUT"
          fi

  binaries:
    name: Binary (${{ matrix.target }})
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest, run: true }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-24.04-arm, run: true }
          - { target: x86_64-apple-darwin, os: macos-latest, run: false }
          - { target: aarch64-apple-darwin, os: macos-latest, run: true }
          - { target: x86_64-pc-windows-msvc, os: windows-latest, run: true, wintun: amd64 }
          - { target: aarch64-pc-windows-msvc, os: windows-latest, run: false, wintun: arm64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install musl tools
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends musl-tools
      - name: Build
        shell: bash
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
          CC_aarch64_unknown_linux_musl: musl-gcc
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Smoke test
        if: matrix.run
        shell: bash
        run: |
          bin=target/${{ matrix.target }}/release/tvpn
          "$bin" --version
          "$bin" genkey | "$bin" pubkey
      - name: Check static linking
        if: contains(matrix.target, 'musl')
        run: |
          file target/${{ matrix.target }}/release/tvpn
          file target/${{ matrix.target }}/release/tvpn | grep -Eq "static(ally|-pie) linked"
      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          name="tvpn-${{ matrix.target }}"
          stage="stage/$name"
          mkdir -p "$stage" dist
          cp README.md LICENSE-MIT LICENSE-APACHE "$stage/"
          if [[ "${{ matrix.target }}" == *windows* ]]; then
            cp "target/${{ matrix.target }}/release/tvpn.exe" "$stage/"
            curl -fsSL "$WINTUN_URL" -o wintun.zip
            echo "$WINTUN_SHA256  wintun.zip" | sha256sum -c -
            7z e wintun.zip "wintun/bin/${{ matrix.wintun }}/wintun.dll" -o"$stage" -y > /dev/null
            test -f "$stage/wintun.dll"
            (cd "$stage" && 7z a -tzip "../../dist/$name.zip" tvpn.exe wintun.dll README.md LICENSE-MIT LICENSE-APACHE > /dev/null)
          else
            cp "target/${{ matrix.target }}/release/tvpn" "$stage/"
            tar -czf "dist/$name.tar.gz" -C "$stage" tvpn README.md LICENSE-MIT LICENSE-APACHE
          fi
          ls -l dist
      - uses: actions/upload-artifact@v7
        with:
          name: bin-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  wheels:
    name: Wheel (${{ matrix.target }}${{ matrix.manylinux && format(' {0}', matrix.manylinux) || '' }})
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64, manylinux: auto }
          - { os: ubuntu-latest, target: aarch64, manylinux: auto }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl, manylinux: musllinux_1_2 }
          - { os: ubuntu-latest, target: aarch64-unknown-linux-musl, manylinux: musllinux_1_2 }
          - { os: macos-latest, target: x86_64-apple-darwin }
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
          - { os: windows-latest, target: aarch64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux || 'auto' }}
          args: --release --locked --out dist
      - uses: actions/upload-artifact@v7
        with:
          name: wheel-${{ matrix.os }}-${{ matrix.target }}-${{ matrix.manylinux || 'native' }}
          path: dist/*.whl
          if-no-files-found: error

  sdist:
    name: Source distribution
    needs: plan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  assemble:
    name: Assemble and verify packages
    needs: [plan, binaries, wheels, sdist]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: bin-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          pattern: "{wheel-*,sdist}"
          path: dist
          merge-multiple: true
      - name: Checksums
        run: |
          cd dist
          sha256sum tvpn-* > SHA256SUMS
          cat SHA256SUMS
      - name: Verify every target is present
        run: |
          for t in $(node -p "require('./packaging/targets.json').targets.map(t => 'tvpn-' + t.triple + '.' + t.archive).join(' ')"); do
            test -f "dist/$t" || { echo "::error::missing $t"; exit 1; }
          done
          ls dist/*.whl | wc -l | grep -qx 8 || { echo "::error::expected 8 wheels"; ls dist; exit 1; }
      - name: Dry-run npm packages
        run: |
          mkdir -p bin
          for f in dist/tvpn-*-*-*.tar.gz; do t="${f#dist/tvpn-}"; t="${t%.tar.gz}"; mkdir -p "bin/$t"; tar -xzf "$f" -C "bin/$t"; done
          for f in dist/tvpn-*-*-*.zip; do t="${f#dist/tvpn-}"; t="${t%.zip}"; mkdir -p "bin/$t"; unzip -q -o "$f" -d "bin/$t"; done
          node packaging/npm/build.mjs --version "${{ needs.plan.outputs.version }}" --artifacts bin --out npm
          for d in npm/*/; do (cd "$d" && npm pack --dry-run 2>&1 | tail -n 4); done
      - name: Render Homebrew formula and winget manifests
        run: |
          node packaging/render.mjs --version "${{ needs.plan.outputs.version }}" \
            --repo "${{ github.repository }}" --checksums dist/SHA256SUMS --out rendered
          ruby -c rendered/homebrew/tvpn.rb
      - uses: actions/upload-artifact@v7
        with:
          name: release-dist
          path: dist/*

  github-release:
    name: GitHub release
    needs: [plan, assemble]
    if: needs.plan.outputs.is_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: release-dist
          path: dist
      - name: Release notes from CHANGELOG.md
        run: |
          version="${{ needs.plan.outputs.version }}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          cat >> notes.md <<EOF

          ## Install

          | | |
          |---|---|
          | Linux / macOS / WSL | \`curl -fsSL https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/install.sh \| sh\` |
          | Windows (PowerShell) | \`irm https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/install.ps1 \| iex\` |

          See the [README](https://github.com/${GITHUB_REPOSITORY}#install) for npm, pip, Homebrew, winget and Cargo.
          Verify downloads with \`SHA256SUMS\`.
          EOF
          cat notes.md
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v${{ needs.plan.outputs.version }}"
          prerelease=""
          [[ "$tag" == *-* ]] && prerelease="--prerelease"
          gh release create "$tag" dist/* --verify-tag --title "tvpn $tag" --notes-file notes.md $prerelease

  publish:
    name: Publish
    needs: [plan, github-release]
    if: needs.plan.outputs.is_release == 'true'
    permissions:
      contents: write
      id-token: write
    uses: ./.github/workflows/publish.yml
    with:
      tag: v${{ needs.plan.outputs.version }}
    secrets: inherit
